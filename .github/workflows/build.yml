name: "Build"

on:
  workflow_dispatch:
    inputs:
      lint:
        description: "Linter"
        type: boolean
        required: false
        default: false
      utest:
        description: "Unit Tests"
        type: boolean
        required: false
        default: false
      itest:
        description: "Integration Tests"
        type: boolean
        required: false
        default: false
      # doc: Just used to "test the documentation", if it would build.
      #      Helps to identify, for example, access to yet private API from
      #      public API.
      doc:
        description: "Build Documentation (No Publish)"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      lint:
        description: "Linter"
        type: boolean
        required: false
        default: false
      utest:
        description: "Unit Tests"
        type: boolean
        required: false
        default: false
      itest:
        description: "Integration Tests"
        type: boolean
        required: false
        default: false
      doc:
        description: "Build Documentation (No Publish)"
        type: boolean
        required: false
        default: false
    secrets:
      PLUGINS_NEXUS_USER:
        required: true
      PLUGINS_NEXUS_PASSWORD:
        required: true

run-name: |
  ${{ github.workflow }} (lint: ${{ github.event.inputs.lint }}, utest: ${{ github.event.inputs.utest }}, itest: ${{ github.event.inputs.itest }})

env:
  # https://github.com/actions/runner-images/issues/70
  NODE_OPTIONS: "--max_old_space_size=4096"

permissions: { }

jobs:
  main:
    name: "Main"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: authorize
        name: "NPM Authorization"
        run: |
          result=$(curl -s -H "Accept: application/json" -H "Content-Type:application/json" -X PUT --data '{"name": "${{ secrets.PLUGINS_NEXUS_USER }}", "password": "${{ secrets.PLUGINS_NEXUS_PASSWORD }}"}' "https://repository.coremedia.com/nexus/repository/coremedia-npm/-/user/org.couchdb.user:${{ secrets.PLUGINS_NEXUS_USER }}" | jq --raw-output .token)
          # Ensure, the token is not exposed in output.
          echo "::add-mask::${result}"
          echo "NODE_AUTH_TOKEN=${result}" >> $GITHUB_ENV
      - id: initNpmConfiguration
        name: "Initialize NPM Configuration"
        run: |
          npmAuthToken="${{ env.NODE_AUTH_TOKEN }}"
          # The .npmrc is not checked in (see .gitignore) and fully generated here.
          {
            echo "@coremedia:registry=https://repository.coremedia.com/nexus/repository/coremedia-npm/"
            echo "@coremedia-internal:registry=https://repository.coremedia.com/nexus/repository/coremedia-npm/"
            echo "//repository.coremedia.com/nexus/repository/coremedia-npm/:_authToken=${npmAuthToken}"
          } > .npmrc
      - id: installPnpm
        name: "Install: Use PNPM (packageManager)"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - id: installNodeJs
        name: "Install: Use Node.js (engines.node)"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: "pnpm"
      - id: install
        name: Install
        run: |
          pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        if: ${{ inputs.itest }}
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/.pnpm/@playwright+test@*/node_modules/@playwright/test/package.json') }}
      - name: Install playwright deps
        if: ${{ inputs.itest && steps.playwright-cache.outputs.cache-hit != 'true' }}
        shell: bash
        working-directory: tests/playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Create env file
        run: |
          touch .env
          echo CKEDITOR_LICENSE_KEY=${{ secrets.CKEDITOR_LICENSE}}>> .env
      - id: build
        name: "Build"
        run: |
          pnpm -r build
      # To move the below steps to reusable workflow, we would need to be able
      # to share artifacts (downloaded dependencies as well as built artifacts).
      # Skipping for now. Instead, an outer workflow may run jobs in parallel,
      # with some extra effort that all of them need to set up authentication,
      # build, etc.
      - id: lint
        if: ${{ inputs.lint }}
        name: "Lint"
        run: pnpm -r lint
      - id: utest
        if: ${{ inputs.utest }}
        name: "Unit Tests"
        env:
          CKEDITOR_LICENSE_KEY: ${{ secrets.CKEDITOR_LICENSE }}
        run: |
          pnpm test
      - id: itest
        if: ${{ inputs.itest }}
        name: "Integration Tests"
        run: |
          pnpm run ui-test
      - id: doc
        if: ${{ inputs.doc }}
        name: "Build Documentation"
        run: |
          pnpm doc
      - name: Add Documentation Artifact
        if: ${{ inputs.doc }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-doc
          path: docs/
          retention-days: 10
